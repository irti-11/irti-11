    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&amp;display=swap');
        
        .bg { fill: #0c0f12; }
        text {
            font-family: 'Fira Code', monospace;
            font-size: 14px; 
            fill: #e2e8f0;
        }
        
        /* Terminal UI Styles */
        .dot { rx: 5; ry: 5; }
        .dot-red { fill: #ff5f56; }
        .dot-yellow { fill: #ffbd2e; }
        .dot-green { fill: #27c93f; }
        .window-title { fill: #6272a4; font-size: 12px; }
        .divider { stroke: #1e222a; stroke-width: 1; }

        /* 1. Printer Animation Keyframes */
        @keyframes printDown {
            0% { height: 0; }
            100% { height: 310px; }
        }
        .print-rect {
            width: 420px;
            height: 0;
            /* steps() forces it to reveal exactly one text line at a time */
            animation: printDown 1.2s steps(23, end) forwards;
        }

        /* 2. Typewriter Animation Keyframes */
        @keyframes typeLine {
            0% { width: 0; }
            100% { width: 400px; }
        }
        .type-rect {
            width: 0;
            /* steps() simulates individual keystrokes */
            animation: typeLine 0.5s steps(40, end) forwards;
        }
        
        .label { font-weight: 600; fill: #f2a6c3; }
        .arrow { fill: #78dec7; }
        .val { fill: #e2e8f0; }
        .stack-val { fill: #aef3a4; font-weight: 600; }
    </style>

