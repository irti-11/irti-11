        /* Terminal UI Styles */
        .dot { rx: 5; ry: 5; }
        .dot-red { fill: #ff5f56; }
        .dot-yellow { fill: #ffbd2e; }
        .dot-green { fill: #27c93f; }
        .window-title { fill: #6272a4; font-size: 12px; }
        .divider { stroke: #1e222a; stroke-width: 1; }

        /* Cascading Animation Rules */
        .ascii-line {
            opacity: 0;
            animation: fadeInLine 0.3s ease-out forwards;
