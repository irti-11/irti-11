<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 70" width="850" height="70">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@600&amp;display=swap');
        
        text { 
            font-family: 'Fira Code', monospace; 
            font-weight: 600; 
            font-size: 12px; 
            fill: #ffffff; 
        }
        
        /* Smooth Infinite Scroll */
        @keyframes scroll {
            0%   { transform: translateX(0px); }
            100% { transform: translateX(-465px); }
        }
        
        .marquee-track {
            animation: scroll 12s linear infinite;
        }
        
        /* Pause on hover */
        .svg-container:hover .marquee-track {
            animation-play-state: paused;
        }
        
        /* BUG FIX: The hover effect targets the inner class now, avoiding translate override */
        .badge-inner {
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), filter 0.3s ease;
            transform-origin: center;
            transform-box: fill-box; /* Ensures it scales from its own center */
            cursor: pointer;
        }
        
        .badge-inner:hover {
            transform: scale(1.08) translateY(-2px);
            filter: drop-shadow(0px 6px 10px rgba(255,255,255,0.2));
        }
        
        .bg-gmail { fill: #DB4437; }
        .bg-linkedin { fill: #0077B5; }
    </style>
    
    <defs>
