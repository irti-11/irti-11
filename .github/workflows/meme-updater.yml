name: Update Dynamic Meme

on:
  schedule:
    - cron: "0 */6 * * *" # Har 6 ghante baad update hoga
  workflow_dispatch: # Tum manually bhi button daba kar run kar sakte ho

jobs:
  update-meme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Generate New Meme SVG
        run: python generate_meme.py

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dynamic_meme.svg
          git commit -m "chore: update dynamic meme based on coding activity" || exit 0
          git push
