name: Update Dynamic Profile Banner

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Banner Core Generator
        run: python generate_banner.py

      - name: Push Assets Back to Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terminal_banner.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-refresh profile terminal visualizer" && git push)
