name: Among Us Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: irti-11
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          filename: metrics.svg
          committer_branch: output
          committer_message: "update metrics"
          config_timezone: Asia/Karachi
          plugin_people: no
          extras_css: |
            .isocalendar .current {
              fill: #9d4edd;
            }
